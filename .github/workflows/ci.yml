name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Pytest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') }}
        run: python -m pytest
      # One cell measures coverage and enforces the floor in pyproject.toml.
      - name: Pytest with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python -m pytest --cov=agentflow --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: Build and install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      # Issue #50: the wheel carries a non-empty license file and
      # declares the MIT license.
      - name: Check the wheel's license
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob('dist/*.whl')[0])
          names = wheel.namelist()
          licenses = [n for n in names if '.dist-info/licenses/' in n]
          assert licenses and all(wheel.read(n).strip() for n in licenses), licenses
          metadata = wheel.read(next(n for n in names if n.endswith('.dist-info/METADATA'))).decode()
          # License-Expression (PEP 639) or the older License field,
          # depending on the setuptools version.
          assert {'License-Expression: MIT', 'License: MIT'} & set(metadata.splitlines()), metadata[:500]
          print('wheel license OK:', licenses)
          PY
      # Install the wheel into a clean venv and import the public entry
      # points from outside the source tree, so missing install_requires
      # (#45) or import-time dependencies show up here.
      - name: Import the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "
          from agentflow.core.agent import Agent
          from agentflow.core.parcel import Parcel
          from agentflow.broker.empty_broker import EmptyBroker
          from agentflow.broker.mqtt_broker import MqttBroker
          print('wheel import OK')
          "
      # Issues #41, #42: every module the wheel ships must import.
      - name: Import every module in the wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import importlib, pkgutil
          import agentflow
          assert 'site-packages' in agentflow.__path__[0], agentflow.__path__
          names = [m.name for m in pkgutil.walk_packages(agentflow.__path__, 'agentflow.')]
          for name in names:
              importlib.import_module(name)
          assert 'agentflow.core.agent' in names, names
          print('imported', len(names), 'modules')
          PY
